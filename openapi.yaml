---
openapi: 3.0.3
info:
  title: Film Server API
  version: "2.1.0"
  description: Minimal HTTP server for movies.

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/v1/stats:
    get:
      summary: Get service and database statistics
      operationId: getStats
      responses:
        '200':
          description: Statistics successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: "Unknown error for request"

  /api/v1/search:
    get:
      summary: Search movies by title, actor, director, or genre
      operationId: searchMovies
      parameters:
        - name: by_title
          in: query
          required: false
          schema:
            type: string
            description: Search by title token (case-insensitive)
        - name: by_actor
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated list of actor names
        - name: by_director
          in: query
          required: false
          schema:
            type: string
            description: Director name
        - name: by_genre
          in: query
          required: false
          schema:
            type: string
            description: Genre name
      responses:
        '200':
          description: List of found movies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmsList'
        '404':
          description: No data found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/video:
    get:
      summary: Stream video file by ID
      operationId: streamVideo
      parameters:
        - name: by_number
          in: query
          required: true
          schema:
            type: string
            example: "123"
          description: ID of the movie (filename will be <id>.mp4)
      responses:
        '200':
          description: Video stream starts
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: Missing 'by_number' parameter
          content:
            text/plain:

components:
  schemas:
    Stats:
      type: object
      properties:
        total_films:
          type: integer
          description: Общее количество фильмов в базе
        total_actors:
          type: integer
          description: Количество уникальных актёров
        total_sessions:
          type: integer
          description: Число активных сессий (из httplib::Server)
        avg_rating:
          type: number
          format: double
          description: Средний рейтинг (если есть)
          nullable: true
      required:
        - total_films
        - total_actors
        - total_sessions

    FilmBrief:
      type: object
      properties:
        title:
          type: string
          description: Название фильма
        year:
          type: integer
          description: Год выпуска
        director:
          type: string
          description: Режиссёр
        actors:
          type: array
          items:
            type: string
          description: Список актёров
        genres:
          type: array
          items:
            type: string
          description: Жанры фильма
      required:
        - title
        - year

    FilmsList:
      type: array
      items:
        $ref: '#/components/schemas/FilmBrief'

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "No matching films found"
      required:
        - code
        - message
